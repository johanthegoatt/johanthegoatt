name: Profile cards

# Regenerates the stats, languages, trophies and contribution snake shown in
# README.md. Runs daily and on demand, using the repo's own token.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stats card
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=johanthegoatt&show_icons=true&include_all_commits=true&rank_icon=github&hide_border=true&bg_color=0d1117&title_color=5b9dff&text_color=c9d1d9&icon_color=5b9dff&ring_color=5b9dff&card_width=460
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=johanthegoatt&layout=compact&langs_count=10&hide_border=true&bg_color=0d1117&title_color=5b9dff&text_color=c9d1d9&card_width=360
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trophies
        continue-on-error: true
        run: node .github/scripts/trophies.mjs johanthegoatt profile/trophy.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: johanthegoatt
          outputs: |
            profile/snake.svg?palette=github-dark&color_snake=#5b9dff&color_dots=#161b22,#0e2a4d,#1d4a85,#3571c4,#5b9dff

      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          if git diff --cached --quiet; then
            echo "cards unchanged"
          else
            git commit -m "Refresh profile cards"
            git push
          fi
